<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>TEDFLIX — Filmes e séries online</title>
<meta name="theme-color" content="#000000" />
<link rel="icon" href="assets/logo/logo.png?v=20261101-1645" />
<link rel="stylesheet" href="css/style.css?v=20261118-recovery" />
</head>
<body style="background-color:#000000;margin:0">
  <header class="topbar" id="topbar">
    <button type="button" class="icon-btn topbar-back" id="topbar-back" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <a class="topbar-avatar" id="topbar-avatar" href="#/config" aria-label="Meu perfil">
      <img id="topbar-avatar-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%23222222'/%3E%3C/svg%3E" alt="" />
      <span class="topbar-avatar-check" aria-hidden="true">✓</span>
    </a>
    <div class="topbar-brand-center" id="topbar-brand">
      <span class="brand-text">TEDFLIX</span>
    </div>
    <div class="topbar-acoes">
      <a class="topbar-search icon-btn" href="#/busca" id="topbar-search" aria-label="Pesquisar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
      </a>
      <a class="icon-btn" href="#/favoritos" id="topbar-fav" aria-label="Favoritos">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span id="fav-badge" class="topbar-badge" aria-hidden="true"></span>
      </a>
    </div>
  </header>

  <main id="app" class="app"></main>
  <nav class="tabbar" id="tabbar"></nav>

  <script>
  window.__tedflixBootErr = function (msg) {
    var a = document.getElementById("app");
    if (!a || a.getAttribute("data-ready") === "1") return;
    a.innerHTML = "<div style=\"color:#fff;padding:24px;text-align:center;font-family:sans-serif\">" +
      "<p style=\"font-weight:700\">Erro ao iniciar</p>" +
      "<p style=\"opacity:.75;word-break:break-word;font-size:13px;margin-top:8px\">" + msg + "</p>" +
      "</div>";
  };
  window.addEventListener("error", function (e) {
    window.__tedflixBootErr((e && e.message) || "erro JS");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e && e.reason;
    window.__tedflixBootErr((r && r.message) || String(r || "promise"));
  });
  setTimeout(function () {
    var a = document.getElementById("app");
    if (a && !a.firstChild) window.__tedflixBootErr("Timeout: app.js não montou a home");
  }, 8000);
  </script>
  <script type="module" src="js/app.js?v=20261118-recovery"></script>
</body>
</html>
